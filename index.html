// ── Jobsite Photos Tab ─────────────────────────────────────────────
function JobsitePhotosTab({contactId, contact}){
  const [photos, setPhotos] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [uploading, setUploading] = React.useState(false);
  const [viewPhoto, setViewPhoto] = React.useState(null);
  const cameraRef = React.useRef(null);

  React.useEffect(()=>{
    sb.from("contacts").select("jobsite_photos").eq("id", contactId).single()
      .then(({data})=>{
        if(data && data.jobsite_photos) setPhotos(data.jobsite_photos);
        setLoading(false);
      });
  },[contactId]);

  const compressJobsitePhoto = (dataUrl) => new Promise(resolve => {
    try {
      const img = new Image();
      img.onerror = () => resolve(dataUrl);
      img.onload = () => {
        try {
          const canvas = document.createElement("canvas");
          const ratio = Math.min(800/img.width, 800/img.height, 1);
          canvas.width = Math.floor(img.width * ratio);
          canvas.height = Math.floor(img.height * ratio);
          const ctx = canvas.getContext("2d");
          if(!ctx){ resolve(dataUrl); return; }
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.55));
        } catch(e){ resolve(dataUrl); }
      };
      img.src = dataUrl;
    } catch(e){ resolve(dataUrl); }
  });

  const handlePhoto = async(e) => {
    const file = e.target.files[0];
    if(!file) return;
    setUploading(true);
    try {
      const reader = new FileReader();
      reader.onerror = () => setUploading(false);
      reader.onload = async(ev) => {
        try {
          const compressed = await compressJobsitePhoto(ev.target.result);
          const newPhoto = {
            id: Date.now(),
            data: compressed,
            taken_at: new Date().toISOString(),
            label: "",
          };
          const updated = [...photos, newPhoto];
          setPhotos(updated);
          await sb.from("contacts").update({jobsite_photos: updated}).eq("id", contactId);
        } catch(err){ console.error("Photo save error:", err); }
        finally { setUploading(false); }
      };
      reader.readAsDataURL(file);
    } catch(e){ setUploading(false); }
  };

  const deletePhoto = async(id) => {
    const updated = photos.filter(p=>p.id!==id);
    setPhotos(updated);
    await sb.from("contacts").update({jobsite_photos: updated}).eq("id", contactId);
  };

  const updateLabel = async(id, label) => {
    const updated = photos.map(p=>p.id===id?{...p,label}:p);
    setPhotos(updated);
    await sb.from("contacts").update({jobsite_photos: updated}).eq("id", contactId);
  };

  return(
    <div>
      {/* Camera button */}
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <button onClick={()=>{cameraRef.current.capture="environment";cameraRef.current.click();}}
          style={{flex:1,padding:"11px",background:C.dark,color:"#fff",border:"none",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          📷 Take Jobsite Photo
        </button>
        <button onClick={()=>{cameraRef.current.removeAttribute("capture");cameraRef.current.click();}}
          style={{padding:"11px 14px",background:"#fff",color:C.sub,border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer"}}>
          📁 Upload
        </button>
        <input ref={cameraRef} type="file" accept="image/*" capture="environment"
          onChange={handlePhoto} style={{display:"none"}}/>
      </div>

      {uploading&&<div style={{textAlign:"center",padding:"12px",color:C.sub,fontSize:12}}>📤 Saving photo...</div>}

      {loading?<Spinner/>:photos.length===0?(
        <div style={{textAlign:"center",padding:"30px 20px",color:C.muted}}>
          <div style={{fontSize:32,marginBottom:8}}>📷</div>
          <div style={{fontSize:13,fontWeight:700,color:C.sub}}>No jobsite photos yet</div>
          <div style={{fontSize:11.5,marginTop:4}}>Tap "Take Jobsite Photo" to capture photos tied to this project</div>
        </div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {photos.map(photo=>(
            <div key={photo.id} style={{border:`1px solid ${C.border}`,borderRadius:8,overflow:"hidden",background:"#fff"}}>
              <div style={{position:"relative",cursor:"pointer"}} onClick={()=>setViewPhoto(photo)}>
                <img src={photo.data} alt="Jobsite" style={{width:"100%",height:120,objectFit:"cover",display:"block"}}/>
                <div style={{position:"absolute",top:4,right:4,display:"flex",gap:4}}>
                  <button onClick={e=>{e.stopPropagation();if(window.confirm("Delete this photo?"))deletePhoto(photo.id);}}
                    style={{background:"rgba(194,86,47,0.85)",border:"none",borderRadius:4,padding:"3px 7px",color:"#fff",fontSize:11,cursor:"pointer",fontWeight:700}}>
                    ✕
                  </button>
                </div>
              </div>
              <div style={{padding:"6px 8px"}}>
                <input value={photo.label} onChange={e=>updateLabel(photo.id, e.target.value)}
                  placeholder="Add label (e.g. Front gutter, Roof damage)"
                  style={{width:"100%",border:"none",fontSize:11,color:C.sub,outline:"none",background:"transparent",boxSizing:"border-box"}}/>
                <div style={{fontSize:9.5,color:C.muted,marginTop:2}}>{new Date(photo.taken_at).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Full screen photo viewer */}
      {viewPhoto&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:16}}
          onClick={()=>setViewPhoto(null)}>
          <div style={{maxWidth:"90vw",maxHeight:"90vh"}}>
            <img src={viewPhoto.data} alt="Jobsite" style={{maxWidth:"100%",maxHeight:"85vh",objectFit:"contain",borderRadius:8}}/>
            {viewPhoto.label&&<div style={{color:"#fff",textAlign:"center",padding:"8px",fontSize:13}}>{viewPhoto.label}</div>}
          </div>
        </div>
      )}
    </div>
  );
}


// ── Edit Contact Modal ────────────────────────────────────────────
function EditContactModal({contact, users, dbUser, onSave, onDelete, onClose}){
  const [f,setF] = React.useState({
    first_name: contact.first_name||"",
    last_name: contact.last_name||"",
    phone: contact.phone||"",
    email: contact.email||"",
    address: contact.address||"",
    city: contact.city||"",
    state: contact.state||"TX",
    zip: contact.zip||"",
    service_type: contact.service_type||"Roof Replacement",
    status: contact.status||"New Lead",
    source: contact.source||"Manual Entry",
    estimated_value: contact.estimated_value||"",
    assigned_rep_id: contact.assigned_rep_id||(dbUser&&dbUser.id),
  });
  const [saving, setSaving] = React.useState(false);
  const [confirmDelete, setConfirmDelete] = React.useState(false);
  const [deleting, setDeleting] = React.useState(false);
  const [err, setErr] = React.useState("");
  const [housePhoto, setHousePhoto] = React.useState(contact.house_photo||null);
  const editPhotoRef = React.useRef(null);
  const isAdmin = (dbUser&&dbUser.role)==="admin";
  const s = k => e => setF(p=>({...p,[k]:e.target.value}));

  const compressImage = (dataUrl) => new Promise(resolve => {
    try {
      const img = new Image();
      img.onerror = () => resolve(dataUrl);
      img.onload = () => {
        try {
          const canvas = document.createElement("canvas");
          const ratio = Math.min(600/img.width, 600/img.height, 1);
          canvas.width = Math.floor(img.width * ratio);
          canvas.height = Math.floor(img.height * ratio);
          const ctx = canvas.getContext("2d");
          if(!ctx){ resolve(dataUrl); return; }
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.5));
        } catch(e){ resolve(dataUrl); }
      };
      img.src = dataUrl;
    } catch(e){ resolve(dataUrl); }
  });

  const handleEditPhoto = async(e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async(ev) => {
      const compressed = await compressImage(ev.target.result);
      setHousePhoto(compressed);
    };
    reader.readAsDataURL(file);
  };

  const save = async () => {
    if(!f.first_name||!f.last_name){setErr("First and last name are required.");return;}
    setSaving(true); setErr("");
    const {data,error} = await sb.from("contacts").update({
      ...f, estimated_value: parseFloat(f.estimated_value)||0,
      house_photo: housePhoto||null,
    }).eq("id", contact.id).select().single();
    if(error){setErr(error.message);setSaving(false);return;}
    onSave(data);
  };

  const handleDelete = async () => {
    setDeleting(true);
    // Delete related records first
    await sb.from("notes").delete().eq("contact_id", contact.id);
    await sb.from("activities").delete().eq("contact_id", contact.id);
    await sb.from("proposals").delete().eq("contact_id", contact.id);
    await sb.from("documents").delete().eq("contact_id", contact.id);
    await sb.from("emails").delete().eq("contact_id", contact.id);
    await sb.from("opportunities").delete().eq("contact_id", contact.id);
    await sb.from("contacts").delete().eq("id", contact.id);
    onDelete(contact.id);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(46,42,33,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}} onClick={onClose}>
      <div style={{background:"#FBF9F3",borderRadius:12,width:480,maxHeight:"92vh",overflowY:"auto",boxShadow:"0 16px 50px rgba(0,0,0,0.28)"}} onClick={e=>e.stopPropagation()}>
        
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"15px 20px",borderBottom:`1px solid ${C.border}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:32,height:32,borderRadius:"50%",background:avatarColor(contact.first_name),color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700}}>{(contact.first_name&&contact.first_name[0])}{(contact.last_name&&contact.last_name[0])}</div>
            <span style={{fontSize:14,fontWeight:700,color:C.dark}}>Edit Contact</span>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:C.muted}}>✕</button>
        </div>

        <div style={{padding:"18px 20px",display:"flex",flexDirection:"column",gap:12}}>

            <Lbl label="Email"><Inp value={f.email} onChange={s("email")} type="email"/></Lbl>
            <Lbl label="Est. Value ($)"><Inp value={f.estimated_value} onChange={s("estimated_value")}/></Lbl>
            <Lbl label="Status"><Sel value={f.status} onChange={s("status")} options={STATUSES}/></Lbl>

          <Lbl label="Property Address"><Inp value={f.address} onChange={s("address")} placeholder="123 Main St"/></Lbl>

          <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:12}}>
            <Lbl label="City"><Inp value={f.city} onChange={s("city")}/></Lbl>
            <Lbl label="State"><Inp value={f.state} onChange={s("state")}/></Lbl>
            <Lbl label="ZIP"><Inp value={f.zip} onChange={s("zip")}/></Lbl>
          </div>

          <Lbl label="Service Type"><Sel value={f.service_type} onChange={s("service_type")} options={SERVICE_TYPES}/></Lbl>
          <Lbl label="Lead Source"><Sel value={f.source} onChange={s("source")} options={SOURCES}/></Lbl>
          
          <Lbl label="Assigned To">
            <select value={f.assigned_rep_id} onChange={s("assigned_rep_id")} style={{width:"100%",padding:"8px 10px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:12.5,background:"#fff"}}>
              {(users||[]).map(u=><option key={u.id} value={u.id}>{u.full_name} ({u.role})</option>)}
            </select>
          </Lbl>

          {/* Delete section — Admin only */}
          {isAdmin&&(
            <div style={{background:"#FFF5F5",border:"1px solid #F5C4C4",borderRadius:8,padding:"14px 16px",marginTop:4}}>
              <div style={{fontSize:12,fontWeight:700,color:"#8B2020",marginBottom:8}}>⚠ Danger Zone — Admin Only</div>
              {!confirmDelete?(
                <button onClick={()=>setConfirmDelete(true)}
                  style={{background:"#8B2020",color:"#fff",border:"none",borderRadius:7,padding:"8px 16px",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>
                  🗑️ Delete This Contact
                </button>
              ):(
                <div>
                  <div style={{fontSize:12.5,color:"#8B2020",marginBottom:10,fontWeight:600}}>
                    Are you sure? This will permanently delete <strong>{contact.first_name} {contact.last_name}</strong> and ALL their notes, activities, and history. This cannot be undone.
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={handleDelete} disabled={deleting}
                      style={{background:"#8B2020",color:"#fff",border:"none",borderRadius:7,padding:"8px 16px",fontSize:12.5,fontWeight:700,cursor:"pointer",opacity:deleting?0.6:1}}>
                      {deleting?"Deleting…":"Yes, Delete Permanently"}
                    </button>
                    <button onClick={()=>setConfirmDelete(false)}
                      style={{background:"#fff",color:C.text,border:`1px solid ${C.border}`,borderRadius:7,padding:"8px 16px",fontSize:12.5,fontWeight:700,cursor:"pointer"}}>
                      Cancel
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>

        {/* House Photo */}
        <div style={{padding:"0 20px 16px"}}>
          <Lbl label="House Photo">
            {housePhoto?(
              <div style={{position:"relative",borderRadius:8,overflow:"hidden",border:`2px solid ${C.sage}`}}>
                <img src={housePhoto} alt="House" style={{width:"100%",maxHeight:160,objectFit:"cover",display:"block"}}/>
                <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,0.5)",padding:"6px 10px",display:"flex",justifyContent:"space-between"}}>
                  <button onClick={()=>editPhotoRef.current.click()} style={{fontSize:11,color:"#fff",background:"rgba(255,255,255,0.2)",border:"none",borderRadius:4,padding:"3px 8px",cursor:"pointer"}}>Retake</button>
                  <button onClick={()=>setHousePhoto(null)} style={{fontSize:11,color:"#fff",background:"rgba(194,86,47,0.8)",border:"none",borderRadius:4,padding:"3px 8px",cursor:"pointer",fontWeight:600}}>Remove</button>
                </div>
              </div>
            ):(
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>{editPhotoRef.current.setAttribute("capture","environment");editPhotoRef.current.click();}} style={{flex:1,padding:"11px",background:C.dark,color:"#fff",border:"none",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer"}}>📷 Take Photo</button>
                <button onClick={()=>{editPhotoRef.current.removeAttribute("capture");editPhotoRef.current.click();}} style={{padding:"11px 14px",background:"#fff",color:C.sub,border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,cursor:"pointer"}}>📁</button>
              </div>
            )}
            <input ref={editPhotoRef} type="file" accept="image/*" onChange={handleEditPhoto} style={{display:"none"}}/>
          </Lbl>
        </div>

        {/* Footer buttons */}
        <div style={{padding:"12px 20px 20px",display:"flex",gap:10,borderTop:`1px solid ${C.border}`,background:"#FBF9F3",position:"sticky",bottom:0}}>
          <Btn primary onClick={save} disabled={saving||!f.first_name||!f.last_name} style={{flex:1,justifyContent:"center",padding:"11px"}}>
            {saving?"Saving…":"💾 Save Changes"}
          </Btn>
          <Btn onClick={onClose} style={{flex:1,justifyContent:"center",padding:"11px"}}>Cancel</Btn>
        </div>
      </div>
    </div>
  );
}


// ── Public Proposal Viewer ─────────────────────────────────────────
function PublicProposalViewer(){
  const [proposal, setProposal] = React.useState(null);
  const [contact, setContact] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState("");
  const [accepted, setAccepted] = React.useState(false);
  const [showSigPad, setShowSigPad] = React.useState(false);
  const [signature, setSignature] = React.useState(null);

  const token = new URLSearchParams(window.location.search).get("token");

  React.useEffect(()=>{
    if(!token){setError("Invalid proposal link.");setLoading(false);return;}
    const load = async() => {
      try {
        // Load proposal by token
        const {data:p, error:pe} = await sb
          .from("proposals")
          .select("*")
          .eq("public_token", token)
          .single();
        if(pe||!p){setError("Proposal not found.");setLoading(false);return;}
        
        // Load contact
        const {data:c} = await sb.from("contacts").select("*").eq("id", p.contact_id).single();
        
        setProposal(p);
        setContact(c);
        if(p.status==="Signed") setAccepted(true);

        // Track view
        await sb.from("proposals").update({
          view_count: (p.view_count||0) + 1,
          last_viewed_at: new Date().toISOString(),
        }).eq("id", p.id);

      } catch(e){ setError("Could not load proposal."); }
      finally { setLoading(false); }
    };
    load();
  },[token]);

  const handleSign = async(sig) => {
    setSignature(sig);
    setShowSigPad(false);
    await sb.from("proposals").update({
      status: "Signed",
      signed_at: new Date().toISOString(),
      proposal_data: {...(proposal.proposal_data||{}), signature: sig},
    }).eq("id", proposal.id);
    setAccepted(true);

    // Send notification email to S&S Contracting
    try {
      const repName = (proposal.proposal_data&&proposal.proposal_data.rep_name)||"Your rep";
      const total = parseFloat(proposal.total_amount||0).toLocaleString(undefined,{minimumFractionDigits:2});
      await emailjs.send(
        "service_vmoglc5",
        "template_1c7tnro",
        {
          to_name: "Stacy",
          to_email: "stacy@sandscontractingco.com",
          subject: `SIGNED: ${pContact.first_name} ${pContact.last_name} signed their proposal - $${total}`,
          message: `Great news! ${pContact.first_name} ${pContact.last_name} just signed their proposal.

Amount: $${total}
Rep: ${repName}
Signed at: ${new Date().toLocaleString()}

Log into FieldDesk to view the signed proposal.`,
          from_name: "FieldDesk CRM",
          reply_to: "stacy@sandscontractingco.com",
        },
        "p7gS6kLQdHLdyi0Xd"
      );
    } catch(e) { console.log("Notification email failed:", e); }
  };

  if(loading) return(
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#EFE9DC",fontFamily:"Arial,sans-serif"}}>
      <div style={{textAlign:"center"}}>
        <div style={{width:40,height:40,border:"4px solid #DCD3BC",borderTop:"4px solid #C2562F",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 16px"}}/>
        <div style={{fontSize:14,color:"#8A8170"}}>Loading your proposal…</div>
      </div>
    </div>
  );

  // Safety check - if contact failed to load, show error instead of crashing
  if(!loading && !error && (!proposal || !contact)) return(
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#EFE9DC",fontFamily:"Arial,sans-serif"}}>
      <div style={{textAlign:"center",padding:40}}>
        <div style={{fontSize:48,marginBottom:16}}>⚠</div>
        <div style={{fontSize:18,fontWeight:700,color:"#2E2A21",marginBottom:8}}>Loading failed</div>
        <div style={{fontSize:14,color:"#8A8170",marginBottom:20}}>Could not load proposal details. Please try again.</div>
        <button onClick={()=>window.location.reload()} style={{padding:"10px 24px",background:"#C2562F",color:"#fff",border:"none",borderRadius:8,fontSize:14,fontWeight:700,cursor:"pointer"}}>
          Try Again
        </button>
      </div>
    </div>
  );

  if(error) return(
    <div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#EFE9DC",fontFamily:"Arial,sans-serif"}}>
      <div style={{textAlign:"center",padding:40}}>
        <div style={{fontSize:48,marginBottom:16}}>😕</div>
        <div style={{fontSize:18,fontWeight:700,color:"#2E2A21",marginBottom:8}}>Proposal Not Found</div>
        <div style={{fontSize:14,color:"#8A8170"}}>{error}</div>
      </div>
    </div>
  );

  if(!proposal||!contact) return null;

  const pd = (proposal&&proposal.proposal_data)||{};

              <div>
                <div style={{fontSize:17,fontWeight:800,color:"#2E2A21"}}>S&amp;S Contracting Company LLC</div>

                <div style={{fontSize:11,color:"#888",marginTop:2}}>12200 Del Norte Way, Yukon, OK 73099</div>
                <div style={{fontSize:11,color:"#888"}}>(405) 201-4139 · sandscontractingco.com</div>
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:26,fontWeight:800,color:"#4169E1"}}>PROPOSAL</div>
              <div style={{fontSize:12,color:"#888",marginTop:4}}>{proposalDate}</div>
            </div>
          </div>

          {/* House photo */}
          {(pd.has_house_photo||pd.house_photo||pContact.house_photo)&&(

              </div>
            </div>

            {/* Signature section */}
            {!accepted?(
              <div style={{border:"1px solid #EAE3D1",borderRadius:10,overflow:"hidden"}}>
                <div style={{background:"#F7F3E9",padding:"12px 16px",borderBottom:"1px solid #EAE3D1"}}>

                  <div style={{fontSize:11.5,color:"#8A8170",marginTop:2}}>By signing below you agree to the terms outlined in this proposal</div>

                <div style={{padding:"16px"}}>
                  <button onClick={()=>setShowSigPad(true)}
                    style={{width:"100%",padding:"14px",background:"#3D6E5C",color:"#fff",border:"none",borderRadius:8,fontSize:15,fontWeight:700,cursor:"pointer"}}>

              </div>
            ):(
              <div style={{border:"1px solid #3D6E5C",borderRadius:10,padding:"16px",background:"#F0FBF6"}}>
                <div style={{fontSize:13,fontWeight:700,color:"#3D6E5C",marginBottom:8}}>✅ Proposal Accepted</div>

                <div style={{fontSize:12,color:"#5C5645"}}>{pContact.first_name} {pContact.last_name}</div>
                <div style={{fontSize:11,color:"#8A8170"}}>Signed on {today}</div>
              </div>
            )}
          </div>
        </div>

        <div style={{textAlign:"center",padding:"20px 0",fontSize:11,color:"#8A8170"}}>
          S&S Contracting Company LLC · 12200 Del Norte Way, Yukon, OK 73099 · (405) 201-4139
        </div>
      </div>

      {showSigPad&&<SignaturePad onSave={handleSign} onClose={()=>setShowSigPad(false)}/>}
    </div>
  );
}

// ── Call List View ─────────────────────────────────────────────────
function CallListView({contacts, activities, users, dbUser, onSelectContact}){
  const today = new Date().toDateString();
  const myId = dbUser&&dbUser.id;
  const isManager = (dbUser&&dbUser.role)==="manager"||(dbUser&&dbUser.role)==="admin";

  // Build call list: contacts with open activities due today or overdue
  const callList = React.useMemo(()=>{
    const actMap = {};
    (activities||[]).forEach(a=>{
      if(a.is_completed) return;
      if(!isManager && a.assigned_user_id !== myId) return;
      const due = a.due_date ? new Date(a.due_date) : null;
      const isOverdue = due && due < new Date();
      const isDueToday = due && due.toDateString() === today;
      if(isOverdue || isDueToday || !due){
        if(!actMap[a.contact_id]) actMap[a.contact_id] = [];
        actMap[a.contact_id].push({...a, isOverdue, isDueToday});
      }
    });

    return (contacts||[])
      .filter(c => actMap[c.id])
      .map(c => ({
        contact: c,
        activities: actMap[c.id].sort((a,b)=>a.isOverdue?-1:1),
        priority: actMap[c.id].some(a=>a.isOverdue) ? "overdue" : "today",
      }))
      .sort((a,b)=> a.priority==="overdue"&&b.priority!=="overdue"?-1:1);
  },[contacts,activities,dbUser]);

  // Also include contacts with no activities but flagged as new leads
  const newLeads = (contacts||[]).filter(c=>{
    if(!isManager && c.assigned_rep_id !== myId) return false;
    const hasActivity = (activities||[]).some(a=>a.contact_id===c.id&&!a.is_completed);
    return !hasActivity && c.status==="New Lead";
  });

  const priorityColor = p => p==="overdue"?"#C2562F":p==="today"?C.gold:C.sub;
  const priorityLabel = p => p==="overdue"?"OVERDUE":p==="today"?"TODAY":"NEW";

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflowY:"auto",background:C.cream}}>
      <div style={{padding:"14px 16px",borderBottom:`1px solid ${C.border}`,background:"#fff"}}>
        <div style={{fontSize:16,fontWeight:800,color:C.dark}}>📞 Call List</div>
        <div style={{fontSize:12,color:C.sub,marginTop:2}}>{callList.length} contacts need attention today</div>
      </div>

      {callList.length===0&&newLeads.length===0?(
        <div style={{textAlign:"center",padding:"40px 20px",color:C.muted}}>
          <div style={{fontSize:36,marginBottom:12}}>🎉</div>
          <div style={{fontSize:15,fontWeight:700,color:C.sub}}>All caught up!</div>
          <div style={{fontSize:12,marginTop:4}}>No calls due today</div>
        </div>
      ):(
        <div style={{padding:"12px 16px",display:"flex",flexDirection:"column",gap:10}}>

          {callList.map(({contact:c, activities:acts, priority})=>(
            <div key={c.id} style={{background:"#fff",border:`2px solid ${priorityColor(priority)}22`,borderLeft:`4px solid ${priorityColor(priority)}`,borderRadius:8,padding:"12px 14px",cursor:"pointer"}}
              onClick={()=>onSelectContact(c)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  {c.house_photo
                    ? <img src={c.house_photo} alt="House" style={{width:40,height:40,borderRadius:6,objectFit:"cover",flexShrink:0}}/>
                    : <div style={{width:40,height:40,borderRadius:"50%",background:C.rust,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,flexShrink:0}}>{(c.first_name&&c.first_name[0])}{(c.last_name&&c.last_name[0])}</div>
                  }
                  <div>
                    <div style={{fontSize:14,fontWeight:700,color:C.dark}}>{c.first_name} {c.last_name}</div>
                    <div style={{fontSize:11.5,color:C.sub}}>{c.address||c.phone||"No address"}</div>
                  </div>
                </div>
                <span style={{fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:10,background:priorityColor(priority)+"22",color:priorityColor(priority),flexShrink:0}}>
                  {priorityLabel(priority)}
                </span>
              </div>
              {acts.map(a=>(
                <div key={a.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:C.tan,borderRadius:6,marginBottom:6}}>
                  <span style={{fontSize:13}}>{a.type==="Call"?"📞":a.type==="Meeting"?"📅":a.type==="Email"?"✉️":"📋"}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12.5,fontWeight:600,color:C.dark}}>{a.title||a.type}</div>
                    {a.due_date&&<div style={{fontSize:11,color:a.isOverdue?C.rust:C.muted}}>
                      {a.isOverdue?"Overdue: ":""}{new Date(a.due_date).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
                    </div>}
                  </div>
                  <a href={`tel:${c.phone}`} onClick={e=>e.stopPropagation()}
                    style={{background:C.sage,color:"#fff",border:"none",borderRadius:6,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer",textDecoration:"none",display:"flex",alignItems:"center",gap:4}}>
                    📞 Call
                  </a>
                </div>
              ))}
              {c.phone&&<div style={{fontSize:11.5,color:C.sub,marginTop:4}}>📱 {c.phone}</div>}
            </div>
          ))}

          {newLeads.length>0&&(
            <div>
              <div style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,margin:"8px 0"}}>New Leads — No Activity Scheduled</div>
              {newLeads.map(c=>(
                <div key={c.id} style={{background:"#fff",border:`1px solid ${C.border}`,borderLeft:`4px solid ${C.indigo}`,borderRadius:8,padding:"12px 14px",cursor:"pointer",marginBottom:8}}
                  onClick={()=>onSelectContact(c)}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontSize:14,fontWeight:700,color:C.dark}}>{c.first_name} {c.last_name}</div>
                      <div style={{fontSize:11.5,color:C.sub}}>{c.phone||"No phone"} · {c.service_type||""}</div>
                    </div>
                    {c.phone&&<a href={`tel:${c.phone}`} onClick={e=>e.stopPropagation()}
                      style={{background:C.indigo,color:"#fff",border:"none",borderRadius:6,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer",textDecoration:"none"}}>
                      📞 Call
                    </a>}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function Login({onLogin}){
  const [email,setEmail]=React.useState("sastotts@hotmail.com");
  const [pass,setPass]=React.useState("");
  const [err,setErr]=React.useState("");
  const [loading,setLoading]=React.useState(false);
  const doLogin=async()=>{
    if(!pass){setErr("Please enter your password.");return;}
    setLoading(true);setErr("");
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){setErr(error.message);setLoading(false);return;}
    const {data:profile}=await sb.from("users").select("*").eq("id",data.user.id).single();
    onLogin(data.session,data.user,profile);
    setLoading(false);
  };
  return(
    <div style={{height:"100vh",background:C.dark,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:C.cream,borderRadius:14,padding:"40px 38px",width:400,boxShadow:"0 20px 60px rgba(0,0,0,0.4)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28}}>
          <img src={SS_LOGO} alt="SS Logo" style={{width:44,height:44,borderRadius:9,objectFit:"cover",background:"#F4EFE6"}}/>
          <div>
            <div style={{fontSize:18,fontWeight:700,color:C.dark}}>S&amp;S Contracting</div>
            <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Roofing · Gutters · Outdoor Living</div>
          </div>
        </div>
        <ErrBox msg={err}/>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Lbl label="Email"><Inp value={email} onChange={e=>setEmail(e.target.value)} type="email"/></Lbl>
          <Lbl label="Password"><Inp value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="Enter your password"/></Lbl>
          <button onClick={doLogin} disabled={loading} style={{padding:"11px",background:C.rust,color:"#fff",border:"none",borderRadius:8,fontSize:14,fontWeight:700,cursor:loading?"not-allowed":"pointer",marginTop:4,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            {loading?<React.Fragment><span className="spin" style={{display:"inline-block",width:16,height:16,border:"2px solid rgba(255,255,255,0.3)",borderTop:"2px solid #fff",borderRadius:"50%"}}/> Signing in…</React.Fragment>:"Sign In →"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────────
function App(){
  const [session,setSession]=React.useState(null);
  const [authUser,setAuthUser]=React.useState(null);
  const [dbUser,setDbUser]=React.useState(null);
  const [contacts,setContacts]=React.useState(null);
  const [selected,setSelected]=React.useState(null);
  const [activities,setActivities]=React.useState(null);
  const [users,setUsers]=React.useState([]);
  const [notes,setNotes]=React.useState([]);
  const [search,setSearch]=React.useState("");
  const [view,setView]=React.useState("contacts");
  const [activeTab,setActiveTab]=React.useState("Notes");
  const [newNote,setNewNote]=React.useState("");
  const [savingNote,setSavingNote]=React.useState(false);
  const [showNewContact,setShowNewContact]=React.useState(false);
  const [showNewActivity,setShowNewActivity]=React.useState(false);
  const [showReassign,setShowReassign]=React.useState(false);
  const [showEditContact,setShowEditContact]=React.useState(false);
  const [showEditActivity,setShowEditActivity]=React.useState(null);
  const [showEmail,setShowEmail]=React.useState(false);
  const [signedAlert,setSignedAlert]=React.useState(null);
  const [showGutterProposal,setShowGutterProposal]=React.useState(false);
  const [showRoofProposal,setShowRoofProposal]=React.useState(false);
  const [showMiscProposal,setShowMiscProposal]=React.useState(false);
  const [showActivityDetail,setShowActivityDetail]=React.useState(null);
  const [showDonePrompt,setShowDonePrompt]=React.useState(false);
  const [doneContact,setDoneContact]=React.useState(null);
  const [editingStatus,setEditingStatus]=React.useState(false);

  const handleLogin=async(sess,user,profile)=>{
    setSession(sess);setAuthUser(user);setDbUser(profile);
  };

  const loadAll=React.useCallback(async()=>{
    const [{data:c},{data:a},{data:u}]=await Promise.all([
      sb.from("contacts").select("*").order("created_at",{ascending:false}),
      sb.from("activities").select("*").order("due_date",{ascending:true}),
      sb.from("users").select("*").order("full_name"),
    ]);
    setContacts(c||[]);
    setActivities(a||[]);
    setUsers(u||[]);
    if((c&&c.length)>0)setSelected(s=>s||(c[0]));
  },[]);

  const loadNotes=React.useCallback(async(contactId)=>{
    const {data}=await sb.from("notes").select("*").eq("contact_id",contactId).order("created_at",{ascending:false});
    setNotes(data||[]);
  },[]);

  React.useEffect(()=>{if(session)loadAll();},[session]);

  // Real-time notification for signed proposals
  React.useEffect(()=>{
    if(!session) return;
    const sub = sb.channel("proposal-signs")
      .on("postgres_changes", {
        event: "UPDATE",
        schema: "public",
        table: "proposals",
      }, (payload) => {
        const p = payload.new;
        if(p.status==="Signed" && p.signed_at){
          const signedAt = new Date(p.signed_at);
          const now = new Date();
          if((now - signedAt) < 15000){
            setSignedAlert(p);
            setTimeout(()=>setSignedAlert(null), 8000);
          }
        }
      })
      .subscribe();
    return () => sb.removeChannel(sub);
  },[session]);
  React.useEffect(()=>{if(selected){setNotes([]);loadNotes(selected.id);}setEditingStatus(false);},[(selected&&selected.id)]);

  const saveNote=async()=>{
    if(!newNote.trim()||!selected)return;
    setSavingNote(true);
    const {data,error}=await sb.from("notes").insert({contact_id:selected.id,author_id:(dbUser&&dbUser.id)||(authUser&&authUser.id),body:newNote.trim()}).select().single();
    if(!error){setNotes(p=>[data,...p]);setNewNote("");}
    setSavingNote(false);
  };

  const updateStatus=async(status)=>{
    await sb.from("contacts").update({status}).eq("id",selected.id);
    const updated={...selected,status};
    setSelected(updated);
    setContacts(p=>p.map(c=>c.id===selected.id?updated:c));
    setEditingStatus(false);
  };

  const [showCompleteNote, setShowCompleteNote] = React.useState(null);
  const [completeNoteText, setCompleteNoteText] = React.useState("");

  const completeActivity=async(a)=>{
    setShowActivityDetail(null);
    setCompleteNoteText("");
    setShowCompleteNote(a);
  };

  const confirmComplete=async()=>{
    const a = showCompleteNote;
    await sb.from("activities").update({
      is_completed:true,
      completed_at:new Date().toISOString(),
      completion_note: completeNoteText||null,
    }).eq("id",a.id);
    setActivities(p=>p.map(x=>x.id===a.id?{...x,is_completed:true,completion_note:completeNoteText}:x));
    // Save note to contact notes if text entered
    if(completeNoteText.trim()){
      await sb.from("notes").insert({
        contact_id: a.contact_id,
        created_by: dbUser?.id||dbUser&&dbUser.id,
        content: `[${a.type||"Activity"} completed] ${completeNoteText}`,
      });
    }
    setShowCompleteNote(null);
    setCompleteNoteText("");
    setDoneContact((contacts||[]).find(c=>c.id===a.contact_id));
    setShowDonePrompt(true);
  };

  const deleteActivity=async(a)=>{
    await sb.from("activities").delete().eq("id",a.id);
    setActivities(p=>p.filter(x=>x.id!==a.id));
    setShowActivityDetail(null);
  };

  const signOut=async()=>{
    await sb.auth.signOut();
    setSession(null);setAuthUser(null);setDbUser(null);
    setContacts(null);setActivities(null);setSelected(null);
  };

  const filtered=(contacts||[]).filter(c=>`${c.first_name} ${c.last_name} ${c.service_type||""}`.toLowerCase().includes(search.toLowerCase()));
  const initials=(dbUser&&dbUser.full_name?dbUser.full_name.split(" ").map(n=>n[0]).join("").slice(0,2):"||");

  // Check if this is a public proposal link
  const urlToken = new URLSearchParams(window.location.search).get("token");
  if(urlToken) return <PublicProposalViewer/>;

  if(!session)return<Login onLogin={handleLogin}/>;

  return(
    <div style={{fontFamily:"-apple-system,sans-serif",background:"#EFE9DC",color:C.text,height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden",fontSize:13}}>

      {/* Signed proposal alert */}
      {signedAlert&&(
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:999,background:"#3D6E5C",color:"#fff",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",boxShadow:"0 4px 20px rgba(0,0,0,0.4)"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:28}}>🎉</span>
            <div>
              <div style={{fontSize:15,fontWeight:800}}>Proposal Signed!</div>
              <div style={{fontSize:12.5,opacity:0.9}}>A customer just accepted — ${parseFloat(signedAlert.total_amount||0).toLocaleString(undefined,{minimumFractionDigits:2})}</div>
            </div>
          </div>
          <button onClick={()=>setSignedAlert(null)} style={{background:"rgba(255,255,255,0.25)",border:"none",borderRadius:6,color:"#fff",padding:"6px 14px",cursor:"pointer",fontSize:13,fontWeight:700}}>✕ Dismiss</button>
        </div>
      )}

      {/* TOP BAR */}
      <header style={{height:56,background:C.dark,display:"flex",alignItems:"center",padding:"0 16px",gap:18,flexShrink:0,borderBottom:`3px solid ${C.rust}`}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <img src={SS_LOGO} alt="SS Logo" style={{width:36,height:36,borderRadius:7,objectFit:"cover",background:"#F4EFE6"}}/>
          <div>
            <div style={{fontSize:15,fontWeight:700,color:"#F4EFE6"}}>S&amp;S Contracting</div>
            <div style={{fontSize:9.5,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Roofing · Gutters · Outdoor Living</div>
          </div>
        </div>
        <div style={{flex:1,maxWidth:420,display:"flex",alignItems:"center",gap:8,background:C.mid,borderRadius:6,padding:"7px 12px"}}>
          <span style={{color:C.sub}}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search contacts…" style={{border:"none",outline:"none",background:"transparent",color:"#F4EFE6",fontSize:12.5,width:"100%"}}/>

        {/* SIDEBAR */}
        <nav style={{width:158,background:C.dark,display:"flex",flexDirection:"column",padding:"12px 8px",gap:1,flexShrink:0}}>
          {[["👥","Contacts","contacts"],["📅","Calendar","calendar"],["📈","Pipeline","pipeline"],["📞","Call Lists","calls"],["🏷️","Price Lists","prices"],["📊","Reports","reports"],["⚙️","Admin","admin"]].map(([icon,label,key])=>(

            <div style={{padding:"20px"}}>
              <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>Completion Note (optional)</div>
              <textarea value={completeNoteText} onChange={e=>setCompleteNoteText(e.target.value)}
                rows={4} autoFocus
                placeholder="What happened? Left voicemail, spoke with customer, scheduled follow-up..."
                style={{width:"100%",padding:"10px 12px",border:`1px solid ${C.border}`,borderRadius:8,fontSize:13,resize:"none",outline:"none",boxSizing:"border-box",lineHeight:1.5}}/>
              <div style={{fontSize:11,color:C.muted,marginTop:6}}>Note will be saved to the contact's Notes tab</div>
              <div style={{display:"flex",gap:10,marginTop:16}}>
                <Btn primary onClick={confirmComplete} style={{flex:1,justifyContent:"center",padding:"11px"}}>✅ Complete</Btn>
                <Btn onClick={()=>setShowCompleteNote(null)} style={{justifyContent:"center",padding:"11px"}}>Cancel</Btn>
              </div>
            </div>
          </div>
        </div>
      )}

      {showEmail&&selected&&<EmailModal
        contact={selected}
        dbUser={dbUser}
        onClose={()=>setShowEmail(false)}/>}

      {showRoofProposal&&selected&&<RoofProposalModal
        contact={selected} dbUser={dbUser}
        onSave={()=>{}}
        onClose={()=>setShowRoofProposal(false)}/>}

      {showMiscProposal&&selected&&<MiscProposalModal
        contact={selected} dbUser={dbUser}
        onSave={()=>{}}
        onClose={()=>setShowMiscProposal(false)}/>}

      {showGutterProposal&&selected&&<GutterProposalModal
        contact={selected}
        dbUser={dbUser}
        onSave={()=>{}}
        onClose={()=>setShowGutterProposal(false)}/>}

      {showEditContact&&selected&&<EditContactModal
        contact={selected}
        users={users}
        dbUser={dbUser}
        onSave={updated=>{
          setContacts(p=>p.map(c=>c.id===updated.id?updated:c));
          setSelected(updated);
          setShowEditContact(false);
        }}
        onDelete={id=>{
          setContacts(p=>p.filter(c=>c.id!==id));
          setSelected(null);
          setShowEditContact(false);
        }}
        onClose={()=>setShowEditContact(false)}/>}

      {showReassign&&<ReassignModal contacts={contacts||[]} users={users}
        onSave={()=>{setShowReassign(false);loadAll();}}
        onClose={()=>setShowReassign(false)}/>}

      {showActivityDetail&&<ActivityDetailModal
        activity={showActivityDetail}
        contact={(contacts||[]).find(c=>c.id===showActivityDetail.contact_id)}
        users={users}
        onClose={()=>setShowActivityDetail(null)}
        onComplete={completeActivity}
        onDelete={deleteActivity}
        onEdit={()=>{setShowEditActivity(showActivityDetail);setShowActivityDetail(null);}}/>}

      {showEditActivity&&<EditActivityModal
        activity={showEditActivity}
        contacts={contacts||[]}
        users={users}
        dbUser={dbUser}
        onSave={updated=>{
          setActivities(p=>p.map(a=>a.id===updated.id?updated:a));
          setShowEditActivity(null);
        }}
        onDelete={id=>{
          setActivities(p=>p.filter(a=>a.id!==id));
          setShowEditActivity(null);
        }}
        onClose={()=>setShowEditActivity(null)}/>}

      {showDonePrompt&&(
        <div style={{position:"fixed",inset:0,background:"rgba(46,42,33,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}} onClick={()=>setShowDonePrompt(false)}>
          <div style={{background:C.cream,borderRadius:12,width:340,boxShadow:"0 16px 50px rgba(0,0,0,0.28)",textAlign:"center",padding:"28px 24px"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:36,marginBottom:12}}>✅</div>
            <div style={{fontSize:15,fontWeight:700,color:C.dark,marginBottom:6}}>Activity Complete!</div>
            <div style={{fontSize:12.5,color:C.sub,marginBottom:22}}>Great work! Want to schedule the next step{doneContact?` with ${doneContact.first_name}`:""}?</div>
            <div style={{display:"flex",gap:10}}>
              <Btn primary onClick={()=>{setShowDonePrompt(false);setShowNewActivity(true);}} style={{flex:1,justifyContent:"center"}}>Schedule Next Activity</Btn>
              <Btn onClick={()=>setShowDonePrompt(false)} style={{flex:1,justifyContent:"center"}}>Not Now</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
